name: Bug report
description: Something does not work, or a review is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not open an issue: use [private vulnerability reporting](https://github.com/openwt-vn/owlet-lens/security/advisories/new).
        A review that is wrong or noisy is a normal bug report; please say which finding and why it is wrong.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [GitHub, GitLab, Bitbucket Cloud, Azure DevOps]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit you use, for example `v1.1.0`.
    validations:
      required: true
  - type: dropdown
    id: subcommand
    attributes:
      label: Which part
      options: [review, reply, learn, not sure]
  - type: input
    id: llm
    attributes:
      label: LLM provider and model
      description: For example `anthropic` / `claude-opus-4-7`. Never paste an API key.
  - type: textarea
    id: logs
    attributes:
      label: Log or reproduction
      description: Relevant lines of the CI log, or a minimal pull request that shows it. Remove secrets and private code first.
      render: text
