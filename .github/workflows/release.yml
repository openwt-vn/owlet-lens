name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    # Takes the runner from CI_RUNNER like the other workflows. This job pushes tags and main with
    # write access, so it must run on GitHub-hosted runners (the default) as soon as the repository is
    # public: unset CI_RUNNER then. While the repository is private, only people we trust can run it.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit dist and update tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${REF_NAME#v}" --no-git-tag-version --allow-same-version
          git add -f dist/ package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: release $REF_NAME [skip ci]"
          git tag -f "$REF_NAME"
          MAJOR=$(echo "$REF_NAME" | cut -d. -f1)
          git tag -f "$MAJOR"
          git push -f origin "$REF_NAME" "$MAJOR"
      - name: Sync package.json version on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          git checkout -B main origin/main
          CURRENT=$(node -p "require('./package.json').version")
          # Only move forward: an older patch tag (e.g. v2.5.3 after v2.6.0) must not downgrade main.
          if ! node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const cmp = a.map((n, i) => n - b[i]).find((d) => d !== 0) ?? 0;
            process.exit(cmp > 0 ? 0 : 1);
          ' "$VERSION" "$CURRENT"; then
            echo "main already at $CURRENT (>= $VERSION), skipping"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin main
      # Third-party action in a job with write access: pinned to a commit (v3.0.4), not to a tag that can move.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
