name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    # Takes the runner from CI_RUNNER like the other workflows. This job pushes tags and main with
    # write access, so it must run on GitHub-hosted runners (the default) as soon as the repository is
    # public: unset CI_RUNNER then. While the repository is private, only people we trust can run it.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write   # npm trusted publishing (OIDC): no npm token is stored in this repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      # The self-hosted runners of one machine share ~/.npm, and installs that run at the same time can
      # corrupt it ("npm error Exit handler never called"). Each job gets its own cache folder, and a
      # failed install is retried once from a clean node_modules.
      - name: Install dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci || { rm -rf node_modules; npm ci; }
      # Trusted publishing needs npm 11.5.1 or newer, and the npm that ships with Node 22 is older.
      - name: Update npm
        run: npm install -g npm@11
      - run: npm test
      - run: npm run build
      - name: Commit dist and update tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${REF_NAME#v}" --no-git-tag-version --allow-same-version
          git add -f dist/ package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: release $REF_NAME [skip ci]"
          git tag -f "$REF_NAME"
          MAJOR=$(echo "$REF_NAME" | cut -d. -f1)
          git tag -f "$MAJOR"
          git push -f origin "$REF_NAME" "$MAJOR"
      # The GitHub Release comes before the npm publish, so an npm failure cannot take it away.
      # Third-party action in a job with write access: pinned to a commit (v3.0.4), not to a tag that can move.
      # The notes list only what changed since the previous version. GitHub's own "generate release
      # notes" finds no previous tag here (the version tags point at release commits that are not on
      # main, so no tag is an ancestor of the next one) and falls back to the whole history. So the
      # previous version tag is picked here and passed to the API explicitly.
      - name: Release notes since the previous version
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=v:refname \
            | awk -v t="$REF_NAME" '$0==t {print prev; exit} {prev=$0}')
          echo "Previous version tag: ${PREV:-none (first release)}"
          if [ -n "$PREV" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$REF_NAME" -f previous_tag_name="$PREV" --jq .body > "$NOTES_FILE"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$REF_NAME" --jq .body > "$NOTES_FILE"
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: ${{ runner.temp }}/release-notes.md
      # Publishes @openwt-vn/owlet-lens with the dist/cli built above. The package must list this
      # repository and this workflow file as its trusted publisher on npmjs.com (package Settings).
      # It needs a GitHub-hosted runner: npm does not support self-hosted runners for this yet.
      - name: Publish to npm
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          PACKAGE=$(node -p "require('./package.json').name")
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already on npm, skipping"
          else
            npm publish
          fi
      - name: Sync package.json version on main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          git checkout -B main origin/main
          CURRENT=$(node -p "require('./package.json').version")
          # Only move forward: an older patch tag (e.g. v2.5.3 after v2.6.0) must not downgrade main.
          if ! node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const cmp = a.map((n, i) => n - b[i]).find((d) => d !== 0) ?? 0;
            process.exit(cmp > 0 ? 0 : 1);
          ' "$VERSION" "$CURRENT"; then
            echo "main already at $CURRENT (>= $VERSION), skipping"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin main
