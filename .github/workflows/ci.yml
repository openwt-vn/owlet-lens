name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The runner comes from the repository variable CI_RUNNER (`self-hosted` while the repository is
    # private). Without it the job runs on GitHub-hosted ubuntu-latest, which is what a public repository
    # should use. This is not a security boundary: a pull request from a fork brings its own workflow
    # file and can change this line.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The self-hosted runners of one machine share ~/.npm, and installs that run at the same time can
      # corrupt it ("npm error Exit handler never called"). Each job gets its own cache folder, and a
      # failed install is retried once from a clean node_modules.
      - name: Install dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci || { rm -rf node_modules; npm ci; }
      - run: npm test
      - run: npm run coverage:gate

  secret-scan:
    # The runner comes from the repository variable CI_RUNNER (`self-hosted` while the repository is
    # private). Without it the job runs on GitHub-hosted ubuntu-latest, which is what a public repository
    # should use. This is not a security boundary: a pull request from a fork brings its own workflow
    # file and can change this line.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The binary is pinned to a version and its checksum, so a moved release cannot change what runs.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Reads .gitleaks.toml. Scans the history that leads to this commit and redacts any value it prints.
      - name: Scan for secrets
        run: ./gitleaks git --redact --no-banner --verbose
