name: ReviewBench image

# Manual build of the ReviewBench agent image (benchmarks/reviewbench) and push
# to GitHub Container Registry. The Owlet Lens version is read from package.json
# on the ref the workflow runs on, and the image tag is <version>-<build>, where
# <build> counts up from 0 for that version (1.8.0-0, 1.8.0-1, ...). Existing
# tags are never overwritten. Register the digest from the run summary.
on:
  workflow_dispatch:

# Two runs at once could pick the same build number.
concurrency:
  group: reviewbench-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/owlet-lens-reviewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version is not x.y.z: $VERSION" >&2
            exit 1
          fi
          # The image installs the published npm package, so the version must exist there.
          PUBLISHED=$(npm view "@openwt-vn/owlet-lens@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" != "$VERSION" ]; then
            echo "@openwt-vn/owlet-lens@${VERSION} is not published on npm yet; release it first" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Pick the next build number
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD=0
          while true; do
            if OUT=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-${BUILD}" 2>&1); then
              BUILD=$((BUILD + 1))
            elif grep -qiE 'not found|manifest unknown|name unknown' <<<"$OUT"; then
              break
            else
              # Auth or network trouble must not look like "tag is free".
              echo "could not check ${IMAGE}:${VERSION}-${BUILD}: $OUT" >&2
              exit 1
            fi
          done
          echo "tag=${VERSION}-${BUILD}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: benchmarks/reviewbench
          platforms: linux/amd64
          push: true
          build-args: |
            OWLET_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
      - name: Show digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### ReviewBench image ${TAG}"
            echo
            echo "Register this digest on review-bench.ai:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
