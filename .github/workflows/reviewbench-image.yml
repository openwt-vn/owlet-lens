name: ReviewBench image

# Manual build of the ReviewBench agent image (benchmarks/reviewbench) and push
# to GitHub Container Registry. Register the digest from the run summary.
on:
  workflow_dispatch:
    inputs:
      owlet_version:
        description: Published @openwt-vn/owlet-lens version to install (x.y.z, or latest)
        required: true
        type: string
        default: latest

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve Owlet Lens version
        id: version
        env:
          REQUESTED: ${{ inputs.owlet_version }}
        run: |
          if ! [[ "$REQUESTED" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "owlet_version must be 'latest' or x.y.z (got: $REQUESTED)" >&2
            exit 1
          fi
          VERSION=$(npm view "@openwt-vn/owlet-lens@${REQUESTED}" version)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "could not resolve a published version for '$REQUESTED'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: benchmarks/reviewbench
          platforms: linux/amd64
          push: true
          build-args: |
            OWLET_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/owlet-lens-reviewer:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Show digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/owlet-lens-reviewer
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### ReviewBench image (Owlet Lens ${VERSION})"
            echo
            echo "Register this digest on review-bench.ai:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
